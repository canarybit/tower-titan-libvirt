name: Generate Terraform docs
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Render Proxmox cVM Terraform docs and push changes back to PR
      uses: terraform-docs/gh-actions@main
      with:
        working-dir: ./modules/proxmox
        output-file: README.md
        output-method: inject
        git-push: "true"

    - name: Render Libvirt cVM Terraform docs and push changes back to PR
      uses: terraform-docs/gh-actions@main
      with:
        working-dir: ./modules/libvirt
        output-file: README.md
        output-method: inject
        git-push: "true"
