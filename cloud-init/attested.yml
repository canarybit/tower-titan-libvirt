#cloud-config
hostname: ${HOSTNAME}
users:
  - default
  - name: ${USERNAME}
    groups: [canarybit]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    ssh_authorized_keys:
      - ${SSH_PUBKEY}

timezone: UTC

package_update: true
package_upgrade: true
package_reboot_if_required: false # CVMs cannot be rebooted
packages:
  - libtss2-dev
  - jq
  - qemu-guest-agent

write_files:
  # Set environment variables for cb-inspector-client systemd service
  - path: /etc/canarybit/tokens
    permissions: '0600'
    defer: true
    content: |
      CB_TOKENS='${CB_TOKENS}'

  # A signing key to identify the current cVM instance
  - path: /etc/canarybit/signing-key.pem
    defer: true
    permissions: '0600'
    content: |
      ${SIGNING_KEY}

  # Custom policy for the current cVM instance (optional)
  - path: /etc/canarybit/custom-policy.rego
    defer: true
    permissions: '0600'
    content: |
      ${CUSTOM_POLICY}

  # Configure cb-inspector-client as a System service
  - path: /etc/systemd/system/cb-inspector-client.service
    defer: true
    permissions: '0600'
    content: |
      [Unit]
      Description=CanaryBit Remote Attestation
      
      [Service]
      EnvironmentFile=/etc/canarybit/tokens
      Environment="CB_INSPECTOR_CLIENT_LOG_LEVEL=info"
      Environment="CB_INSPECTOR_CLIENT_ENVIRONMENTS=${ENVIRONMENTS}"
      Environment="CB_INSPECTOR_CLIENT_INSPECTOR_URL=${CB_INSPECTOR_URL}"
      Environment="CB_INSPECTOR_CLIENT_ANNOTATIONS=${CB_INSPECTOR_CLIENT_ANNOTATIONS}"
      Type=oneshot
      ExecStart=/bin/bash -c '/usr/local/bin/cb-inspector-client --token $$(cb login inspector) --key /etc/canarybit/signing-key.pem ${CUSTOM_POLICY_OPT}'

  # Set a frequency for cb-inspector-client.service
  - path: /etc/systemd/system/cb-inspector-client.timer
    defer: true
    permissions: '0600'
    content: |
      [Unit]
      Description=CanaryBit Remote Attestation Timer
      
      [Timer]
      OnCalendar=${FREQUENCY}
      Persistent=true
      
      [Install]
      WantedBy=timers.target

  # Initialize the cb-inspector-client systemd service
  - path: /etc/canarybit/launch-cb-inspector-client
    defer: true
    permissions: '0755'
    content: |
      #!/bin/bash

      # Download the CanaryBit CLI (cb) into /usr/local/bin
      curl -fsSL https://canarybit-public-binaries.s3.eu-west-1.amazonaws.com/cb-cli/${CBCLI_V}/cb-x86_64-unknown-linux-gnu -o cb; chmod +x cb; mv cb /usr/local/bin/cb

      # Download the CanaryBit Inspector agent (cb-inspector-client) into /usr/local/bin
      CB_TOKENS='${CB_TOKENS}' cb download cb-inspector-client ${CB_INSPECTOR_CLIENT_V}/cb-inspector-client; chmod +x ${CB_INSPECTOR_CLIENT_V}/cb-inspector-client; mv ${CB_INSPECTOR_CLIENT_V}/cb-inspector-client /usr/local/bin/cb-inspector-client

      # Start cb-inspector-client as System service once and then a defined frequency
      systemctl start cb-inspector-client.service
      systemctl enable --now cb-inspector-client.timer

runcmd:
  # Enable qemu-agent for IP retrieval
  - systemctl enable --now qemu-guest-agent
  # Launch cb-inspector-client as systemd service
  - /etc/canarybit/launch-cb-inspector-client

final_message: |
  ==========   CANARYBIT TOWER SETUP COMPLETED IN $UPTIME secs    ==========
  The security and privacy of this environment is verified by CanaryBit Remote Attestation service:
  ${CB_INSPECTOR_URL}
